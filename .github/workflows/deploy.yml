
name: CI/CD - IronFit Gustavo no Coolify

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar no Coolify?"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-backend:
    name: CI - Build Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar backend
        run: bash ./mvnw -B -DskipTests package

  build-frontend:
    name: CI - Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar frontend
        run: npm run build

  deploy:
    name: CD - Deploy no Coolify
    runs-on: ubuntu-latest

    needs:
      - build-backend
      - build-frontend

    if: ${{ inputs.publicar == true }}

    steps:
      - name: Deploy Backend
        env:
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_BACKEND }}
        run: |
          test -n "$TOKEN" && test -n "$WEBHOOK"
          curl --fail-with-body -sS -X POST "$WEBHOOK" \
            -H "Authorization: Bearer $TOKEN"

      - name: Deploy Frontend
        env:
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_FRONTEND }}
        run: |
          test -n "$TOKEN" && test -n "$WEBHOOK"
          curl --fail-with-body -sS -X POST "$WEBHOOK" \
            -H "Authorization: Bearer $TOKEN"
