spring:
  application:
    name: ironfit-api
  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

ironfit:
  cors:
    allowed-origins: http://localhost:5173
  storage:
    upload-dir: uploads
  jwt:
    secret: ${JWT_SECRET:PPrw/m4PExYDqq/SGwKDAndutE59OwYHdC3qcwlYoHawwX526FwZ9Hw4Ck35c2TY}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
  security:
    password-reset-token-ttl-hours: 1
    login-rate-limit:
      capacity: 5
      refill-minutes: 15
